name: CI

# Single linear job, run in the exact order the verify-foundation plan specifies. Two boundaries
# are marked explicitly below:
#   1. INSTALL/REGISTRY-ACCESS BOUNDARY: steps up to and including "Warm wasm-pack build cache"
#      legitimately need network access, to fetch crates.io/npm registry packages, the
#      wasm-bindgen-cli tool wasm-pack downloads on first use, and the Playwright browser binary.
#   2. OFFLINE-SAFE BOUNDARY: every step after that point runs with `CARGO_NET_OFFLINE=true` and
#      needs no network access to succeed, because everything it depends on was already fetched
#      above. This distinguishes "no runtime network dependency" (a claim about the *shipped app*,
#      proven by the final no-external-URL check) from "CI needs the internet to install its own
#      dependencies" (unavoidable and unrelated to that claim).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Matches `rust-toolchain.toml`.
  RUST_TOOLCHAIN: "1.97.1"
  # Matches the pinned dev-tooling version noted in this project's setup docs.
  WASM_PACK_VERSION: "0.15.0"
  # Matches the lower bound of `web/package.json`'s `engines.node` range
  # (`^20.19.0 || >=22.12.0`), pinned exactly for reproducibility.
  NODE_VERSION: "22.12.0"

jobs:
  verify:
    name: Verify (fmt, clippy, tests, wasm parity, web checks, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # --- INSTALL / REGISTRY-ACCESS BOUNDARY (network access expected and required) ----------

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Fetch cargo dependencies (registry access)
        run: cargo fetch --locked

      - name: Install wasm-pack (pinned version)
        run: cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked

      - name: Install npm dependencies (registry access)
        working-directory: web
        run: npm ci

      - name: Install Playwright's Chromium browser binary (one-time download)
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Warm wasm-pack's wasm-bindgen-cli download cache
        # `wasm-pack` downloads a matching `wasm-bindgen-cli` binary from GitHub releases on first
        # use (not a `cargo`/crates.io concern, so `CARGO_NET_OFFLINE` below would not prevent
        # it) and caches it locally for every subsequent invocation, including every `--target web`
        # build the `web/` npm scripts trigger automatically via their `pre*` hooks. Running it
        # once here, before the offline boundary, means every later `wasm-pack` call in this
        # workflow is a pure cache hit.
        run: wasm-pack build crates/limen-wasm --target web --out-dir "$GITHUB_WORKSPACE/web/src/wasm/pkg" --no-opt

      # --- OFFLINE-SAFE BOUNDARY (no step below this line should need network access) ---------

      - name: Rust format check
        run: cargo fmt --check
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Rust lint (clippy, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Rust test suite (unit, property, golden, schema-validation, scenario)
        run: cargo test --workspace
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Schema freshness and golden-fixture schema validation (named explicitly)
        # Already covered by the full `cargo test --workspace` run above; run by name here too so
        # these specific, required-by-plan checks are unambiguous in the CI log.
        run: cargo test -p limen-core --test schema_freshness --test golden_schema_validation
        env:
          CARGO_NET_OFFLINE: "true"

      - name: wasm-pack build (--target web, the shipped browser artifact)
        run: wasm-pack build crates/limen-wasm --target web --out-dir "$GITHUB_WORKSPACE/web/src/wasm/pkg" --no-opt
        env:
          CARGO_NET_OFFLINE: "true"

      - name: wasm-pack test --node (native/WASM parity, 75-trial golden matrix)
        run: wasm-pack test --node crates/limen-wasm
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Biome check (web/)
        working-directory: web
        run: npm run lint

      - name: TypeScript typecheck (web/src)
        working-directory: web
        run: npm run typecheck

      - name: TypeScript typecheck (web/e2e)
        working-directory: web
        run: npm run typecheck:e2e

      - name: Vitest suite (web/)
        working-directory: web
        run: npm test

      - name: Playwright e2e suite (web/, against a real served production build)
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report (on failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      - name: Static web production build
        working-directory: web
        run: npm run build

      - name: Assert the built web/dist contains no external URLs
        run: node scripts/check-no-external-urls.mjs web/dist
